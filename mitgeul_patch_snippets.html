<!-- ══════════════════════════════════════════════════
  수정 3 of 3 : JavaScript 추가 + saveInfo() 수정

  기존 <script> 태그 안에 아래 함수들을 추가하세요.
  (window.onload 근처에 추가하면 편합니다)
  
  그리고 saveInfo() 함수 안
  goStep(1); 바로 위에
  updatePlaceBarLabel();
  한 줄 추가하세요.
════════════════════════════════════════════════════ -->
<script>
// ── 플레이스 열기 함수
function openMyPlace() {
  var url = (state.info && state.info.storeUrl) ? state.info.storeUrl.trim() : '';
  if (!url) {
    var warn = document.getElementById('placeNoUrlWarn');
    if (warn) { warn.style.display='block'; setTimeout(function(){ warn.style.display='none'; }, 3000); }
    return;
  }
  if (!url.startsWith('http')) url = 'https://' + url;
  window.open(url, '_blank');
  
  var btn = document.getElementById('openPlaceBtn');
  if (btn) {
    var orig = btn.textContent;
    btn.textContent = '✓ 열렸습니다!';
    btn.style.cssText = 'background:rgba(61,255,192,0.15);color:#3DFFC0;border:1px solid rgba(61,255,192,0.4);border-radius:10px;font-size:13px;font-weight:700;padding:10px 20px;cursor:pointer;font-family:Pretendard,sans-serif;white-space:nowrap;transition:all .2s;';
    setTimeout(function(){
      btn.textContent = orig;
      btn.style.cssText = 'background:#3DFFC0;color:#111850;border:none;border-radius:10px;font-size:13px;font-weight:700;padding:10px 20px;cursor:pointer;font-family:Pretendard,sans-serif;white-space:nowrap;transition:all .2s;';
    }, 2000);
  }
}

// ── 플레이스 바 URL 상태 업데이트
function updatePlaceBarLabel() {
  var url = (state.info && state.info.storeUrl) ? state.info.storeUrl.trim() : '';
  var indicator = document.getElementById('placeUrlIndicator');
  var btn = document.getElementById('openPlaceBtn');
  
  if (indicator) {
    if (url) {
      var short = url.replace(/^https?:\/\//, '').replace(/\?.*/, '');
      if (short.length > 22) short = short.substring(0, 22) + '…';
      indicator.textContent = '✓ ' + short;
      indicator.style.color = '#3DFFC0';
      indicator.style.borderColor = 'rgba(61,255,192,0.35)';
      indicator.style.background = 'rgba(61,255,192,0.08)';
    } else {
      indicator.textContent = 'URL 미입력';
      indicator.style.color = '#64748b';
      indicator.style.borderColor = 'rgba(61,255,192,0.15)';
      indicator.style.background = 'rgba(61,255,192,0.04)';
    }
  }
  if (btn) {
    btn.style.opacity = url ? '1' : '0.7';
  }
}

// ── saveInfo() 함수 안 goStep(1) 바로 위에 추가:
// updatePlaceBarLabel();
</script>
